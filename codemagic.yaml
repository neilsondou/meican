# AI 识别密钥在 Codemagic 的应用环境变量中配置：
# MEICAN_AI_KEYS = key1,key2,key3,key4（标记为 Secure，勿写入仓库）
workflows:
  ios-unsigned:
    name: 每餐
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 获取依赖
        script: flutter pub get
      - name: 检查
        script: flutter analyze && flutter test
      - name: 检查 AI 服务配置
        script: |
          if [ -z "$MEICAN_AI_KEYS" ]; then
            echo "缺少 MEICAN_AI_KEYS。请在 Codemagic → 应用 → Environment variables 添加该变量（多个密钥用逗号分隔），然后重新构建。"
            exit 1
          fi
      - name: 构建未签名 Release
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=MEICAN_AI_KEYS="$MEICAN_AI_KEYS"
      - name: 打包未签名 IPA
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qry ../MeiCan-iOS-unsigned.ipa Payload
    artifacts:
      - build/ios/MeiCan-iOS-unsigned.ipa

  android-release:
    name: 每餐 · Android APK
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: 获取依赖
        script: flutter pub get
      - name: 检查
        script: flutter analyze && flutter test
      - name: 检查 AI 服务配置
        script: |
          if [ -z "$MEICAN_AI_KEYS" ]; then
            echo "缺少 MEICAN_AI_KEYS。请在 Codemagic → 应用 → Environment variables 添加该变量（多个密钥用逗号分隔），然后重新构建。"
            exit 1
          fi
      - name: 构建 APK
        script: |
          flutter build apk --release \
            --dart-define=MEICAN_AI_KEYS="$MEICAN_AI_KEYS"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
