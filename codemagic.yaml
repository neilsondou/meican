workflows:
  ios-unsigned:
    name: 每餐
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 获取依赖
        script: flutter pub get
      - name: 检查
        script: flutter analyze && flutter test
      - name: 构建未签名 Release
        script: flutter build ios --release --no-codesign
      - name: 打包未签名 IPA
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qry ../MeiCan-iOS-unsigned.ipa Payload
    artifacts:
      - build/ios/MeiCan-iOS-unsigned.ipa

  android-release:
    name: 每餐 · Android APK
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: 获取依赖
        script: flutter pub get
      - name: 检查
        script: flutter analyze && flutter test
      - name: 构建 APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
