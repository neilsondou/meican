# 每餐 · Codemagic
# 可选环境变量（Codemagic → 应用 → Environment variables）：
#   MEICAN_AI_KEYS           多个密钥，逗号分隔；不填则使用 lib/ai_keys.dart 内置测试密钥
#   ANDROID_KEYSTORE_BASE64  release keystore 的 base64；配置后 APK 使用固定签名，可覆盖安装
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
workflows:
  ios-unsigned:
    name: 每餐 · iOS 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.0
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: 环境信息
        script: |
          flutter --version
          xcodebuild -version
      - name: 获取依赖
        script: flutter pub get
      - name: 检查与测试
        script: |
          dart analyze lib test
          flutter test
      - name: 构建未签名 Release
        script: |
          DART_DEFINE=""
          if [ -n "$MEICAN_AI_KEYS" ]; then
            DART_DEFINE="--dart-define=MEICAN_AI_KEYS=$MEICAN_AI_KEYS"
          fi
          flutter build ios --release --no-codesign \
            --build-number="$BUILD_NUMBER" \
            $DART_DEFINE
      - name: 打包未签名 IPA
        script: |
          rm -rf build/ios/unsigned
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qry ../MeiCan-iOS-unsigned.ipa Payload
          ls -lh ../MeiCan-iOS-unsigned.ipa
    artifacts:
      - build/ios/MeiCan-iOS-unsigned.ipa

  android-release:
    name: 每餐 · Android APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: 3.44.0
      java: 17
    scripts:
      - name: 环境信息
        script: flutter --version
      - name: 获取依赖
        script: flutter pub get
      - name: 检查与测试
        script: |
          dart analyze lib test
          flutter test
      - name: 准备 release 签名
        script: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" > android/key.properties
            echo "已配置 release keystore，本次 APK 使用固定签名。"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，本次使用 debug 签名；不同构建之间可能无法覆盖安装。"
          fi
      - name: 构建 APK
        script: |
          DART_DEFINE=""
          if [ -n "$MEICAN_AI_KEYS" ]; then
            DART_DEFINE="--dart-define=MEICAN_AI_KEYS=$MEICAN_AI_KEYS"
          fi
          flutter build apk --release \
            --build-number="$BUILD_NUMBER" \
            $DART_DEFINE
      - name: 校验 APK
        script: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          fi
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
