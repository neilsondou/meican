<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="每餐 — 简单记录饮食、热量与体重趋势。">
  <meta id="meican-theme-color" name="theme-color" content="#000000">
  <script>
    // 启动前先按已保存的偏好铺底色，避免亮色模式刷新时闪黑。
    (function () {
      try {
        var light = localStorage.getItem('flutter.meican_light_mode') === 'true';
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        var meta = document.getElementById('meican-theme-color');
        if (meta) meta.setAttribute('content', light ? '#F4EFE5' : '#000000');
      } catch (error) {}
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="每餐">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>每餐</title>
  <link rel="manifest" href="manifest.json">
  <!-- Vercel 在国内很慢，首屏 JS、CanvasKit 和字体都走 jsDelivr 国内镜像。 -->
  <link rel="preconnect" href="https://cdn.jsdmirror.com" crossorigin>
  <link
    rel="preload"
    href="https://cdn.jsdmirror.com/gh/neilsondou/meican@a734f6ec9e76349848d11b2de186078381ed8475/assets/fonts/MeicanSans-Regular.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  >
  <link
    rel="preload"
    href="https://cdn.jsdmirror.com/gh/neilsondou/meican@a734f6ec9e76349848d11b2de186078381ed8475/assets/fonts/MeicanSans-SemiBold.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  >
  <style>
    :root {
      --meican-bg: #000;
      --meican-fg: #f5f5f7;
      --meican-muted: rgba(245, 245, 247, 0.46);
      --meican-track: rgba(245, 245, 247, 0.14);
    }

    html[data-theme="light"] {
      --meican-bg: #f4efe5;
      --meican-fg: #29251e;
      --meican-muted: rgba(41, 37, 30, 0.45);
      --meican-track: rgba(91, 76, 55, 0.14);
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--meican-bg);
    }

    /* 浏览器会给 Flutter Web 的语义节点加上链接下划线。 */
    flt-semantics,
    flt-semantics * {
      text-decoration: none !important;
    }

    #meican-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--meican-bg);
      color: var(--meican-fg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", sans-serif;
      transition: opacity 320ms ease;
    }

    #meican-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #meican-splash .loading-label {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--meican-muted);
    }

    #meican-splash .bar {
      position: relative;
      width: 108px;
      height: 3px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--meican-track);
    }

    #meican-splash .bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: inherit;
      background: #a8bfa8;
      animation: meican-bar 1100ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes meican-bar {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(250%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #meican-splash .bar::after {
        animation-duration: 2.2s;
      }
    }
  </style>
</head>
<body>
  <div id="meican-splash" role="status" aria-label="正在加载">
    <div class="loading-label">加载中</div>
    <div class="bar"></div>
  </div>
  <noscript>需要启用 JavaScript 才能使用每餐。</noscript>
  <script>
    // 高 DPR 手机上 CanvasKit 的填充开销会随像素数平方增长；限制到 2x
    // 能明显减轻点击和动画的掉帧，画面尺寸与布局不变。
    (function () {
      var ua = navigator.userAgent || '';
      var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
      var ratio = window.devicePixelRatio || 1;
      if (isMobile && ratio > 2) {
        try {
          Object.defineProperty(window, 'devicePixelRatio', {
            configurable: true,
            get: function () {
              return 2;
            },
          });
        } catch (error) {}
      }
    })();

    (function () {
      var splash = document.getElementById('meican-splash');
      function dismiss() {
        if (!splash || splash.classList.contains('is-hidden')) return;
        splash.classList.add('is-hidden');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }
      window.addEventListener('flutter-first-frame', dismiss);
      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view')) {
          setTimeout(dismiss, 1500);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
